name: GateHop
options:
  bundleIdPrefix: dev.nova
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: NO
targets:
  GateHop:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: GateHop/Sources
      - path: GateHop/Assets.xcassets
    info:
      path: GateHop/Info.plist
    settings:
      base:
        PRODUCT_NAME: GateHop
        PRODUCT_BUNDLE_IDENTIFIER: dev.nova.gatehop
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
    frameworks:
      - sdk: SwiftUI.framework
      - sdk: Network.framework
